<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bulma.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      h1.title {
        color: white;
        background-color: #000;
        margin-bottom: 1rem !important;
      }

      table.table th,
      table.table td {
        text-align: center;
        border-color: black;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Broselow-Luten Zones</h1>
    
    <div class="container">
      <table class="table is-bordered is-striped is-fullwidth">
        <tbody>
          <tr>
            <th class="broselow gray" colspan="2">3 kg, 4 kg, 5 kg</th>
          </tr>
          <tr>
            <th class="broselow pink">Pink</th>
            <td>6-7 kg</td>
          </tr>
          <tr>
            <th class="broselow red">Red</th>
            <td>8-9 kg</td>
          </tr>
          <tr>
            <th class="broselow purple">Purple</th>
            <td>10-11 kg</td>
          </tr>
          <tr>
            <th class="broselow yellow">Yellow</th>
            <td>12-14 kg</td>
          </tr>
          <tr>
            <th class="broselow white">White</th>
            <td>15-18 kg</td>
          </tr>
          <tr>
            <th class="broselow blue">Blue</th>
            <td>19-23 kg</td>
          </tr>
          <tr>
            <th class="broselow orange">Orange</th>
            <td>24-29 kg</td>
          </tr>
          <tr>
            <th class="broselow green">Green</th>
            <td>30-36 kg</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
